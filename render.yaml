services:
  - type: web
    name: healthrecom-service
    env: python
    buildCommand: "pip install -r requirements.txt && python train_and_export.py"
    startCommand: "gunicorn app:app --workers=2 --bind=0.0.0.0:$PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.8
